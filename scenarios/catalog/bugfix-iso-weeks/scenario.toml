title = "Fix ISO 8601 week assignment in a timesheet report"
category = "bugfix"
# The symptom is reported in the report output; the cause is in weeks.py. A fix
# that special-cases late December passes the reported example but not the
# hidden tests, which cover every day from 2000 to 2030.

[fake]
check = "python3 -m unittest discover -s tests -t ."
# Exits 0 while the seed's bug is present; the runner checks the scripted reproduction.
probe = 'python3 -c "from datetime import date; from timesheet.weeks import week_key; assert week_key(date(2024, 12, 30)) != week_key(date(2025, 1, 2))"'
